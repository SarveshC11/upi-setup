# All numbers here are version 1 placeholders. Change them only through this file
# (or an override file) and record the reason in docs/assumptions.md.

sizes:
  users: 1000
  legit_per_user: 30
  attacks_per_type: 300

seeds:
  parity: 7
  tune: [1, 2, 3, 4, 5]
  report: [101, 102, 103, 104, 105]

generator:
  evasive: false
  median: {loc: 400, sigma: 0.8, min: 60, max: 5000}
  ratio: {sigma: 0.7, big_prob: 0.03, big_low: 10, big_high: 150}
  coverage: {sim_feed: 0.90, remote: 0.85}
  evasive_params: {look_normal_prob: 0.60, fri_zero_prob: 0.85}
  legit:
    new_device: 0.02
    network: {home: 0.45, mobile: 0.50, public: 0.05}
    new_payee: 0.12
    velocity: 0.03
    far_location: 0.03
    true_sim_change: 0.005
    true_remote: 0.005
    fri: [0.975, 0.020, 0.004, 0.001]

attacks:
  simswap:
    new_device: 0.95
    network: {home: 0.10, mobile: 0.60, public: 0.30}
    new_payee: 0.95
    median_multiple: 25
    sigma: 0.6
    velocity: 0.5
    sim_change: 0.9
    remote: 0.05
    far_location: 0.5
    fri: [0.45, 0.20, 0.20, 0.15]
    immutable: [sim_change]
  screenshare:
    new_device: 0.03
    network: {home: 0.50, mobile: 0.50, public: 0.0}
    new_payee: 0.90
    median_multiple: 15
    sigma: 0.7
    velocity: 0.2
    sim_change: 0.0
    remote: 0.9
    far_location: 0.05
    fri: [0.45, 0.20, 0.20, 0.15]
    immutable: [remote]
  collect:
    new_device: 0.02
    network: {home: 0.50, mobile: 0.48, public: 0.02}
    new_payee: 0.90
    median_multiple: 6
    sigma: 0.6
    velocity: 0.1
    sim_change: 0.0
    remote: 0.05
    far_location: 0.05
    fri: [0.45, 0.20, 0.20, 0.15]
    immutable: [new_payee]
  replay:
    new_device: 0.80
    network: {home: 0.20, mobile: 0.30, public: 0.50}
    new_payee: 0.70
    median_multiple: 8
    sigma: 0.6
    velocity: 0.7
    sim_change: 0.1
    remote: 0.05
    far_location: 0.4
    fri: [0.90, 0.05, 0.03, 0.02]
    immutable: []
  stolen:
    new_device: 0.0
    network: {home: 0.10, mobile: 0.70, public: 0.20}
    new_payee: 0.90
    median_multiple: 15
    sigma: 0.7
    velocity: 0.7
    sim_change: 0.0
    remote: 0.0
    far_location: 0.6
    fri: [0.45, 0.20, 0.20, 0.15]
    immutable: [new_payee]

policy:
  weights:
    new_device: 30
    net_mobile: 5
    net_public: 15
    new_payee: 15
    amt_2_10x: 10
    amt_over_10x: 25
    velocity: 10
    sim_change: 25
    remote: 30
    far_location: 15
    fri_medium: 10
    fri_high: 20
    fri_very_high: 35
  base_thresholds: [20, 50, 70]
  shift: 0

costs:
  friction: {"0": 0.0, "W": 0.5, "1": 1.0, "2": 5.0, "3": 10.0}
  abandon: {"0": 0.0, "W": 0.01, "1": 0.02, "2": 0.25, "3": 0.60}
  p_stop:
    "0": {simswap: 0.0, screenshare: 0.0, collect: 0.0, replay: 0.0, stolen: 0.0}
    "W": {simswap: 0.05, screenshare: 0.15, collect: 0.15, replay: 0.02, stolen: 0.02}
    "1": {simswap: 0.15, screenshare: 0.10, collect: 0.10, replay: 0.50, stolen: 0.35}
    "2": {simswap: 0.55, screenshare: 0.50, collect: 0.50, replay: 0.80, stolen: 0.60}
    "3": {simswap: 0.90, screenshare: 0.85, collect: 0.85, replay: 0.95, stolen: 0.85}

baselines:
  amount_rule_limit: 10000
  ml_enabled: true

experiment:
  shifts: {start: -30, stop: 60, step: 3}
  sensitivity_scales: [0.5, 1.0, 2.0]

attacker:                      # learned attacker (Person 1): see sim/attacker.py
  tries: 120                   # probes of the policy per attacker (a real attacker cannot probe forever)
  random_frac: 0.4             # share of the budget spent on random search before CMA-ES
  optimizer: cma               # cma, or es (built-in evolution strategy) if the cma package is missing
  train_seeds: [1, 2, 3]
  test_seeds: [101, 102, 103, 104, 105]
  shifts: {start: -30, stop: 60, step: 6}
  held_out: collect            # attack type never seen when training the shared strategy
  rng_seed: 0
  max_amount: 100000           # rupees; per-payment cap on any attack (assumed UPI limit, verify)
