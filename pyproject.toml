[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upi-stepup"
version = "0.1.0"
description = "Adaptive step-up authentication for UPI: simulator, policy engine, evaluation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
opt = ["cma>=3.3"]
service = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]

[tool.setuptools.packages.find]
include = ["common*", "sim*", "policy*", "baselines*", "eval*", "service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
